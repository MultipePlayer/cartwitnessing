<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>스마트 교대 근무표</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- React & ReactDOM (Stable CDN) -->
    <script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
    <script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
    
    <!-- Babel -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>

    <style>
        body { font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif; }
    </style>
</head>
<body class="bg-gray-50 text-gray-800">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        // --- 아이콘 컴포넌트 (Inline SVG) ---
        // 외부 라이브러리 의존성 제거를 위해 직접 정의
        const IconBase = ({ children, ...props }) => (
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" {...props}>
                {children}
            </svg>
        );

        const Icons = {
            Settings: (props) => <IconBase {...props}><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.47a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/><circle cx="12" cy="12" r="3"/></IconBase>,
            MapPin: (props) => <IconBase {...props}><path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0Z"/><circle cx="12" cy="10" r="3"/></IconBase>,
            Clock: (props) => <IconBase {...props}><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></IconBase>,
            Phone: (props) => <IconBase {...props}><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"/></IconBase>,
            Shuffle: (props) => <IconBase {...props}><path d="M2 18h1.4c1.3 0 2.5-.6 3.3-1.7l10.6-12.6c.7-1.1 1.9-1.7 3.3-1.7H22"/><path d="M2 6h1.4c1.3 0 2.5.6 3.3 1.7l10.6 12.6c.7 1.1 1.9 1.7 3.3 1.7H22"/></IconBase>,
            Users: (props) => <IconBase {...props}><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></IconBase>,
            Plus: (props) => <IconBase {...props}><path d="M5 12h14"/><path d="M12 5v14"/></IconBase>,
            Trash2: (props) => <IconBase {...props}><path d="M3 6h18"/><path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"/><path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"/><line x1="10" x2="10" y1="11" y2="17"/><line x1="14" x2="14" y1="11" y2="17"/></IconBase>,
            Save: (props) => <IconBase {...props}><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><polyline points="17 21 17 13 7 13 7 21"/><polyline points="7 3 7 8 15 8"/></IconBase>,
            X: (props) => <IconBase {...props}><path d="M18 6 6 18"/><path d="m6 6 12 12"/></IconBase>,
            CheckCircle2: (props) => <IconBase {...props}><path d="M12 22c5.523 0 10-4.477 10-10S17.523 2 12 2 2 6.477 2 12s4.477 10 10 10z"/><path d="m9 12 2 2 4-4"/></IconBase>,
            Circle: (props) => <IconBase {...props}><circle cx="12" cy="12" r="10"/></IconBase>,
            AlertCircle: (props) => <IconBase {...props}><circle cx="12" cy="12" r="10"/><line x1="12" x2="12" y1="8" y2="12"/><line x1="12" x2="12.01" y1="16" y2="16"/></IconBase>,
            LinkIcon: (props) => <IconBase {...props}><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/></IconBase>,
            Share2: (props) => <IconBase {...props}><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><line x1="8.59" x2="15.42" y1="13.51" y2="17.49"/><line x1="15.41" x2="8.59" y1="6.51" y2="10.49"/></IconBase>,
            Copy: (props) => <IconBase {...props}><rect width="14" height="14" x="8" y="8" rx="2" ry="2"/><path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2"/></IconBase>,
            Calculator: (props) => <IconBase {...props}><rect width="16" height="20" x="4" y="2" rx="2"/><line x1="8" x2="16" y1="6" y2="6"/><line x1="16" x2="16" y1="14" y2="18"/><path d="M16 10h.01"/><path d="M12 10h.01"/><path d="M8 10h.01"/><path d="M12 14h.01"/><path d="M8 14h.01"/><path d="M12 18h.01"/><path d="M8 18h.01"/></IconBase>,
            Lock: (props) => <IconBase {...props}><rect width="18" height="11" x="3" y="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></IconBase>
        };

        const { 
            Settings, MapPin, Clock, Phone, Shuffle, Users, Plus, Trash2, 
            Save, X, CheckCircle2, Circle, AlertCircle, LinkIcon, Share2, Copy, 
            Calculator, Lock 
        } = Icons;


        // --- 유틸리티 함수 ---

        const timeToMinutes = (time) => {
            if (!time) return 0;
            const [h, m] = time.split(':').map(Number);
            return h * 60 + m;
        };

        const minutesToTime = (minutes) => {
            let h = Math.floor(minutes / 60);
            const m = minutes % 60;
            if (h >= 24) h = h % 24; 
            return `${String(h).padStart(2, '0')}:${String(m).padStart(2, '0')}`;
        };

        const generateTimeSlots = (start, end, interval) => {
            const slots = [];
            let current = timeToMinutes(start);
            const endTime = timeToMinutes(end);

            while (current < endTime) {
                slots.push(minutesToTime(current));
                current += parseInt(interval);
            }
            return slots;
        };

        // --- 메인 컴포넌트 ---
        function ShiftScheduler() {
            // 1. 설정 상태
            const [config, setConfig] = useState({
                startTime: '09:00',
                endTime: '18:00',
                interval: 15, 
                peoplePerShift: 2,
                locationCount: 1, 
                mergeRemainder: true, 
                genderRule: 'mixed', 
            });

            // 2. 관리자 정보
            const [manager, setManager] = useState({
                name: '',
                phone: '',
            });

            // 3. 장소 목록
            const [locations, setLocations] = useState(['정문']);

            // 4. 참여자 목록
            const [participants, setParticipants] = useState([
                { id: 1, name: '김철수', gender: 'M', availStart: '09:00', availEnd: '18:00', useDefaultTime: true, partnerId: null, preferredLocation: '' },
                { id: 2, name: '이영희', gender: 'F', availStart: '09:00', availEnd: '18:00', useDefaultTime: true, partnerId: null, preferredLocation: '' },
                { id: 3, name: '박민수', gender: 'M', availStart: '09:00', availEnd: '18:00', useDefaultTime: true, partnerId: null, preferredLocation: '' },
                { id: 4, name: '최지우', gender: 'F', availStart: '09:00', availEnd: '18:00', useDefaultTime: true, partnerId: null, preferredLocation: '' },
                { id: 5, name: '정우성', gender: 'M', availStart: '09:00', availEnd: '18:00', useDefaultTime: true, partnerId: null, preferredLocation: '' },
                { id: 6, name: '한지민', gender: 'F', availStart: '09:00', availEnd: '18:00', useDefaultTime: true, partnerId: null, preferredLocation: '' },
                { id: 7, name: '오지호', gender: 'M', availStart: '09:00', availEnd: '18:00', useDefaultTime: true, partnerId: null, preferredLocation: '' },
                { id: 8, name: '신민아', gender: 'F', availStart: '09:00', availEnd: '18:00', useDefaultTime: true, partnerId: null, preferredLocation: '' },
                { id: 9, name: '강동원', gender: 'M', availStart: '09:00', availEnd: '18:00', useDefaultTime: true, partnerId: null, preferredLocation: '' },
            ]);

            // 5. 스케줄 데이터
            const [schedule, setSchedule] = useState({});

            // 6. UI 상태
            const [isSetupOpen, setIsSetupOpen] = useState(true);
            const [activeTab, setActiveTab] = useState('basic'); 
            const [genderTab, setGenderTab] = useState('M'); 
            const [newNameInput, setNewNameInput] = useState(''); 
            const [rotationStep, setRotationStep] = useState(0);

            // --- 로직 ---

            const preprocessParticipants = (originalList, genderRule) => {
                const units = [];
                const visited = new Set();

                originalList.forEach(p => {
                    if (visited.has(p.id)) return;
                    
                    const unit = [p];
                    visited.add(p.id);

                    if (p.partnerId) {
                        const partner = originalList.find(u => u.id === parseInt(p.partnerId));
                        if (partner && !visited.has(partner.id)) {
                            unit.push(partner);
                            visited.add(partner.id);
                        }
                    }
                    units.push(unit);
                });

                units.sort((a, b) => {
                    const getLocIndex = (unit) => {
                        const p1 = unit[0].preferredLocation;
                        if (p1 !== '' && p1 !== undefined) return parseInt(p1);
                        if (unit.length > 1) {
                            const p2 = unit[1].preferredLocation;
                            if (p2 !== '' && p2 !== undefined) return parseInt(p2);
                        }
                        return 999; 
                    };

                    const locA = getLocIndex(a);
                    const locB = getLocIndex(b);
                    if (locA !== locB) return locA - locB;

                    if (genderRule === 'separate') {
                        const getGenderType = (unit) => {
                            const g1 = unit[0].gender;
                            const g2 = unit.length > 1 ? unit[1].gender : g1;
                            if (g1 !== g2) return 2; 
                            if (g1 === 'M') return 0;
                            return 1;
                        };
                        return getGenderType(a) - getGenderType(b);
                    }
                    return 0;
                });

                return units.flat();
            };

            const createTeams = (people, size, merge, genderRule) => {
                const teams = [];
                if (people.length === 0) return [];
                
                let currentTeam = [];
                
                for (let i = 0; i < people.length; i++) {
                    const person = people[i];
                    
                    if (currentTeam.length === size) {
                        teams.push(currentTeam);
                        currentTeam = [];
                    }

                    if (genderRule === 'separate' && currentTeam.length > 0) {
                        const firstMember = currentTeam[0];
                        const isPartner = (firstMember.partnerId && parseInt(firstMember.partnerId) === person.id) || 
                                          (person.partnerId && parseInt(person.partnerId) === firstMember.id);
                        
                        if (firstMember.gender !== person.gender && !isPartner) {
                            teams.push(currentTeam);
                            currentTeam = [];
                        }
                    }
                    currentTeam.push(person);
                }

                if (currentTeam.length > 0) {
                    if (merge && currentTeam.length < size && teams.length > 0) {
                        const lastTeam = teams[teams.length - 1];
                        let canMerge = true;
                        if (genderRule === 'separate') {
                            const lastTeamRep = lastTeam[0];
                            const currentTeamRep = currentTeam[0];
                            if (lastTeamRep.gender !== currentTeamRep.gender) {
                                canMerge = false;
                            }
                        }
                        if (canMerge) {
                            teams[teams.length - 1] = [...lastTeam, ...currentTeam];
                        } else {
                            teams.push(currentTeam);
                        }
                    } else {
                        teams.push(currentTeam);
                    }
                }
                return teams;
            };

            const generateSchedule = () => {
                const timeSlots = generateTimeSlots(config.startTime, config.endTime, config.interval);
                const newSchedule = {};
                
                const processedPeople = preprocessParticipants(participants, config.genderRule);
                let teams = createTeams(processedPeople, parseInt(config.peoplePerShift), config.mergeRemainder, config.genderRule);
                
                if (teams.length === 0) {
                    setSchedule({});
                    return;
                }

                if (rotationStep > 0) {
                    const rotateCount = rotationStep % teams.length;
                    teams = [...teams.slice(rotateCount), ...teams.slice(0, rotateCount)];
                }

                let teamIndex = 0; 

                timeSlots.forEach((time) => {
                    newSchedule[time] = {};
                    const currentSlotMinutes = timeToMinutes(time);
                    const nextSlotMinutes = currentSlotMinutes + parseInt(config.interval);

                    locations.forEach((loc, locIdx) => {
                        newSchedule[time][loc] = [];
                        let attempts = 0;
                        let assignedMembers = [];
                        
                        while (attempts < teams.length) {
                            const candidateTeam = teams[teamIndex % teams.length];
                            
                            const isTimeAvailable = candidateTeam.every(p => {
                                const pStartStr = p.useDefaultTime ? config.startTime : p.availStart;
                                const pEndStr = p.useDefaultTime ? config.endTime : p.availEnd;
                                const pStart = timeToMinutes(pStartStr);
                                const pEnd = timeToMinutes(pEndStr);
                                if (isNaN(pStart) || isNaN(pEnd)) return false;
                                return currentSlotMinutes >= pStart && nextSlotMinutes <= pEnd;
                            });

                            const isLocationCompatible = candidateTeam.every(p => {
                                return p.preferredLocation === '' || p.preferredLocation === undefined || parseInt(p.preferredLocation) === locIdx;
                            });

                            if (isTimeAvailable && isLocationCompatible) {
                                assignedMembers = candidateTeam;
                                teamIndex++; 
                                break;
                            } else {
                                teamIndex++; 
                                attempts++;
                            }
                        }

                        if (assignedMembers.length > 0) {
                            newSchedule[time][loc] = assignedMembers;
                        } else {
                            newSchedule[time][loc] = [null]; 
                        }
                    });
                });
                setSchedule(newSchedule);
            };

            const copyToClipboard = () => {
                let text = `[스마트 교대 근무표]\n`;
                text += `운영 시간: ${config.startTime} ~ ${config.endTime}\n\n`;

                const sortedTimes = Object.keys(schedule).sort();
                sortedTimes.forEach(time => {
                    text += `⏰ ${time}\n`;
                    locations.forEach(loc => {
                        const members = schedule[time][loc];
                        if (members && members.length > 0) {
                            const names = members.map(m => m ? m.name : "미배정").join(", ");
                            text += `  └ ${loc}: ${names}\n`;
                        }
                    });
                    text += `\n`;
                });
                text += `\n(생성된 근무표입니다)`;

                navigator.clipboard.writeText(text).then(() => {
                    alert("근무표가 복사되었습니다!\n카카오톡 채팅방에 '붙여넣기' 하세요.");
                }).catch(err => {
                    console.error("복사 실패:", err);
                    alert("복사하기 기능을 지원하지 않는 브라우저입니다.");
                });
            };

            // Event Handlers
            const handleConfigChange = (e) => {
                const { name, value, type, checked } = e.target;
                setConfig(prev => ({ ...prev, [name]: type === 'checkbox' ? checked : value }));
            };

            const updateLocations = (count) => {
                const newCount = Math.min(5, Math.max(1, count));
                setConfig(prev => ({ ...prev, locationCount: newCount }));
                setLocations(prev => {
                    const newLocs = [...prev];
                    if (newCount > prev.length) {
                        for (let i = prev.length; i < newCount; i++) newLocs.push(`장소 ${i + 1}`);
                    } else {
                        newLocs.splice(newCount);
                    }
                    return newLocs;
                });
            };

            const handleLocationNameChange = (idx, val) => {
                const newLocs = [...locations];
                newLocs[idx] = val;
                setLocations(newLocs);
            };

            const handleAddParticipant = (e) => {
                if (e.key === 'Enter' && newNameInput.trim()) {
                    e.preventDefault();
                    const newId = participants.length > 0 ? Math.max(...participants.map(p => p.id)) + 1 : 1;
                    setParticipants([...participants, { 
                        id: newId, 
                        name: newNameInput.trim(), 
                        gender: genderTab, 
                        availStart: config.startTime, 
                        availEnd: config.endTime, 
                        useDefaultTime: true,
                        partnerId: null,
                        preferredLocation: '' 
                    }]);
                    setNewNameInput('');
                }
            };

            const removeParticipant = (id) => {
                setParticipants(participants.map(p => 
                    p.partnerId == id ? { ...p, partnerId: null } : p
                ).filter(p => p.id !== id));
            };

            const updateParticipant = (id, field, value) => {
                setParticipants(participants.map(p => {
                    if (p.id === id) return { ...p, [field]: value };
                    if (field === 'partnerId' && p.id === parseInt(value)) return { ...p, partnerId: id };
                    return p;
                }));
            };

            const handleDurationChange = (id, minutesStr) => {
                const minutes = parseInt(minutesStr);
                if (isNaN(minutes)) return;
                setParticipants(participants.map(p => {
                    if (p.id === id) {
                        const startMins = timeToMinutes(p.availStart);
                        const newEndMins = startMins + minutes;
                        const newEnd = minutesToTime(newEndMins);
                        return { ...p, availEnd: newEnd, useDefaultTime: false }; 
                    }
                    return p;
                }));
            };

            const toggleTimeSettings = (id) => {
                setParticipants(participants.map(p => {
                    if (p.id === id) {
                        const newUseDefault = !p.useDefaultTime;
                        return { 
                            ...p, 
                            useDefaultTime: newUseDefault,
                            availStart: p.availStart, 
                            availEnd: p.availEnd
                        };
                    }
                    return p;
                }));
            };

            useEffect(() => {
                if (!isSetupOpen && participants.length > 0) generateSchedule();
            }, [isSetupOpen, rotationStep]);

            const filteredParticipants = participants.filter(p => p.gender === genderTab);

            // --- 렌더링 ---
            return (
                <div className="min-h-screen bg-gray-50 text-gray-800 font-sans">
                    {/* 헤더 */}
                    <header className="bg-white shadow-md sticky top-0 z-10 border-b border-gray-200">
                        <div className="max-w-7xl mx-auto px-4 py-4 flex flex-col md:flex-row justify-between items-center gap-4">
                            <div className="flex items-center gap-2">
                                <div className="bg-indigo-600 p-2 rounded-lg">
                                    <Clock className="w-6 h-6 text-white" />
                                </div>
                                <h1 className="text-2xl font-bold text-gray-900 tracking-tight">스마트 교대 근무표</h1>
                            </div>
                            
                            {manager.name && (
                                <a href={`tel:${manager.phone}`} className="flex items-center gap-3 bg-indigo-50 px-4 py-2 rounded-full border border-indigo-100 hover:bg-indigo-100 transition cursor-pointer group">
                                    <div className="flex flex-col items-end">
                                        <span className="text-xs text-indigo-500 font-semibold">담당자 (Manager)</span>
                                        <span className="font-bold text-indigo-900 group-hover:text-indigo-700">{manager.name}</span>
                                    </div>
                                    <div className="bg-indigo-600 rounded-full p-2 text-white">
                                        <Phone className="w-4 h-4" />
                                    </div>
                                </a>
                            )}
                            
                            <div className="flex gap-2">
                                <button onClick={() => setIsSetupOpen(true)} className="flex items-center gap-2 px-4 py-2 bg-gray-200 hover:bg-gray-300 rounded-lg text-sm font-medium transition">
                                    <Settings className="w-4 h-4" /> 설정 수정
                                </button>
                                <button onClick={() => setRotationStep(prev => prev + 1)} className="flex items-center gap-2 px-4 py-2 bg-indigo-600 hover:bg-indigo-700 text-white rounded-lg text-sm font-medium shadow-sm transition">
                                    <Shuffle className="w-4 h-4" /> 순서 변경
                                </button>
                                <button onClick={copyToClipboard} className="flex items-center gap-2 px-4 py-2 bg-yellow-400 hover:bg-yellow-500 text-yellow-900 rounded-lg text-sm font-bold shadow-sm transition">
                                    <Share2 className="w-4 h-4" /> 공유
                                </button>
                            </div>
                        </div>
                    </header>

                    {/* 메인 콘텐츠 */}
                    <main className="max-w-7xl mx-auto px-4 py-8">
                        <div className="mb-6 grid grid-cols-2 md:grid-cols-4 gap-4">
                            <div className="bg-white p-4 rounded-xl shadow-sm border border-gray-100">
                                <p className="text-gray-500 text-xs">총 참여 인원</p>
                                <p className="text-2xl font-bold text-gray-800">{participants.length}명</p>
                            </div>
                            <div className="bg-white p-4 rounded-xl shadow-sm border border-gray-100">
                                <p className="text-gray-500 text-xs">근무 장소</p>
                                <p className="text-2xl font-bold text-gray-800">{locations.length}곳</p>
                            </div>
                            <div className="bg-white p-4 rounded-xl shadow-sm border border-gray-100">
                                <p className="text-gray-500 text-xs">교대 간격</p>
                                <p className="text-2xl font-bold text-gray-800">{config.interval}분</p>
                            </div>
                            <div className="bg-white p-4 rounded-xl shadow-sm border border-gray-100">
                                <p className="text-gray-500 text-xs">운영 방식</p>
                                <div className="flex flex-col">
                                    <span className="text-sm font-bold text-indigo-600">{config.mergeRemainder ? "나머지 합치기" : "정량 배정"}</span>
                                    <span className="text-xs text-gray-400">{config.genderRule === 'mixed' ? '남녀 혼성' : '남녀 분리(엄격)'}</span>
                                </div>
                            </div>
                        </div>

                        <div className="bg-indigo-900 text-white rounded-t-xl p-4 flex justify-between items-center shadow-md">
                            <div className="flex items-center gap-2">
                                <Clock className="w-5 h-5 text-indigo-300" />
                                <span className="font-bold text-lg">전체 근무 시간</span>
                            </div>
                            <div className="text-xl font-mono font-bold tracking-wider">{config.startTime} ~ {config.endTime}</div>
                        </div>

                        <div className="bg-white rounded-b-xl shadow-lg border border-gray-200 overflow-hidden border-t-0">
                            <div className="overflow-x-auto">
                                <table className="w-full text-left border-collapse">
                                    <thead>
                                        <tr className="bg-gray-50 border-b border-gray-200">
                                            <th className="p-4 font-semibold text-gray-600 w-32 sticky left-0 bg-gray-50 z-10">시간</th>
                                            {locations.map((loc, idx) => (
                                                <th key={idx} className="p-4 font-semibold text-gray-600 min-w-[200px]">
                                                    <div className="flex items-center gap-2">
                                                        <MapPin className="w-4 h-4 text-indigo-500" />
                                                        {loc}
                                                    </div>
                                                </th>
                                            ))}
                                        </tr>
                                    </thead>
                                    <tbody className="divide-y divide-gray-100">
                                        {Object.keys(schedule).sort().map((time) => (
                                            <tr key={time} className="hover:bg-gray-50/50 transition">
                                                <td className="p-4 font-mono font-medium text-indigo-900 sticky left-0 bg-white border-r border-gray-100 shadow-[4px_0_8px_-4px_rgba(0,0,0,0.05)]">{time}</td>
                                                {locations.map((loc) => (
                                                    <td key={`${time}-${loc}`} className="p-3 align-top">
                                                        <div className="flex flex-wrap gap-2">
                                                            {schedule[time]?.[loc]?.map((person, pIdx) => (
                                                                person ? (
                                                                    <div key={pIdx} className={`flex items-center gap-1.5 px-3 py-1.5 rounded-full text-sm font-medium border shadow-sm ${person.gender === 'M' ? 'bg-blue-50 text-blue-700 border-blue-100' : 'bg-pink-50 text-pink-700 border-pink-100'}`}>
                                                                        <span className={`w-2 h-2 rounded-full ${person.gender === 'M' ? 'bg-blue-400' : 'bg-pink-400'}`}></span>
                                                                        {person.name}
                                                                    </div>
                                                                ) : (
                                                                    <div key={pIdx} className="flex items-center gap-2 px-3 py-1.5 rounded-full text-sm text-red-500 border border-dashed border-red-200 bg-red-50">
                                                                        <AlertCircle className="w-3 h-3"/> 배정 불가(시간)
                                                                    </div>
                                                                )
                                                            ))}
                                                            {(!schedule[time]?.[loc] || schedule[time][loc].length === 0) && <span className="text-gray-300 text-sm">-</span>}
                                                        </div>
                                                    </td>
                                                ))}
                                            </tr>
                                        ))}
                                        {Object.keys(schedule).length === 0 && (
                                            <tr><td colSpan={locations.length + 1} className="p-12 text-center text-gray-400">설정을 완료하고 스케줄을 생성해주세요.</td></tr>
                                        )}
                                    </tbody>
                                </table>
                            </div>
                        </div>
                    </main>

                    {isSetupOpen && (
                        <div className="fixed inset-0 bg-black/60 backdrop-blur-sm z-50 flex items-center justify-center p-4">
                            <div className="bg-white w-full max-w-4xl rounded-2xl shadow-2xl flex flex-col max-h-[90vh]">
                                <div className="p-6 border-b border-gray-100 flex justify-between items-center bg-gray-50 rounded-t-2xl">
                                    <div>
                                        <h2 className="text-xl font-bold text-gray-900">근무 환경 설정</h2>
                                        <p className="text-sm text-gray-500">참여자 순서에 맞춰 반복해서 자동으로 배정됩니다.</p>
                                    </div>
                                    <button onClick={() => setIsSetupOpen(false)} className="p-2 hover:bg-gray-200 rounded-full text-gray-500"><X className="w-5 h-5" /></button>
                                </div>

                                <div className="flex border-b border-gray-200">
                                    <button onClick={() => setActiveTab('basic')} className={`flex-1 py-3 text-sm font-medium border-b-2 transition ${activeTab === 'basic' ? 'border-indigo-600 text-indigo-600' : 'border-transparent text-gray-500 hover:text-gray-700'}`}>1. 기본 & 장소 설정</button>
                                    <button onClick={() => setActiveTab('participants')} className={`flex-1 py-3 text-sm font-medium border-b-2 transition ${activeTab === 'participants' ? 'border-indigo-600 text-indigo-600' : 'border-transparent text-gray-500 hover:text-gray-700'}`}>2. 참여자 관리 ({participants.length}명)</button>
                                </div>

                                <div className="flex-1 overflow-y-auto p-6 bg-white">
                                    {activeTab === 'basic' && (
                                        <div className="space-y-8">
                                            <section>
                                                <h3 className="text-sm font-bold text-gray-900 uppercase tracking-wider mb-4">담당자 정보</h3>
                                                <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                                                    <div>
                                                        <label className="block text-sm font-medium text-gray-700 mb-1">담당자 이름</label>
                                                        <input type="text" value={manager.name} onChange={(e) => setManager({...manager, name: e.target.value})} placeholder="홍길동" className="w-full border border-gray-300 rounded-lg p-2.5 focus:ring-2 focus:ring-indigo-500 outline-none" />
                                                    </div>
                                                    <div>
                                                        <label className="block text-sm font-medium text-gray-700 mb-1">연락처</label>
                                                        <input type="tel" value={manager.phone} onChange={(e) => setManager({...manager, phone: e.target.value})} placeholder="010-1234-5678" className="w-full border border-gray-300 rounded-lg p-2.5 focus:ring-2 focus:ring-indigo-500 outline-none" />
                                                    </div>
                                                </div>
                                            </section>
                                            <hr className="border-gray-100" />
                                            <section>
                                                <h3 className="text-sm font-bold text-gray-900 uppercase tracking-wider mb-4">시간 및 교대 규칙</h3>
                                                <div className="grid grid-cols-2 md:grid-cols-4 gap-4">
                                                    <div><label className="block text-sm font-medium text-gray-700 mb-1">시작 시간</label><input type="time" name="startTime" value={config.startTime} onChange={handleConfigChange} className="w-full border border-gray-300 rounded-lg p-2.5 outline-none focus:border-indigo-500" /></div>
                                                    <div><label className="block text-sm font-medium text-gray-700 mb-1">종료 시간</label><input type="time" name="endTime" value={config.endTime} onChange={handleConfigChange} className="w-full border border-gray-300 rounded-lg p-2.5 outline-none focus:border-indigo-500" /></div>
                                                    <div>
                                                        <label className="block text-sm font-medium text-gray-700 mb-1">교대 시간(분)</label>
                                                        <select name="interval" value={config.interval} onChange={handleConfigChange} className="w-full border border-gray-300 rounded-lg p-2.5 outline-none focus:border-indigo-500">
                                                            <option value="5">5분</option><option value="10">10분</option><option value="15">15분</option><option value="20">20분</option><option value="25">25분</option><option value="30">30분</option>
                                                        </select>
                                                    </div>
                                                    <div><label className="block text-sm font-medium text-gray-700 mb-1">타임당 인원</label><input type="number" name="peoplePerShift" min="1" max="10" value={config.peoplePerShift} onChange={handleConfigChange} className="w-full border border-gray-300 rounded-lg p-2.5 outline-none focus:border-indigo-500" /></div>
                                                </div>
                                                <div className="mt-4 grid grid-cols-1 md:grid-cols-2 gap-4">
                                                    <div className="bg-yellow-50 p-4 rounded-lg border border-yellow-100">
                                                        <div className="flex items-start gap-3">
                                                            <div className="flex items-center h-5"><input id="mergeRemainder" name="mergeRemainder" type="checkbox" checked={config.mergeRemainder} onChange={handleConfigChange} className="w-4 h-4 text-indigo-600 border-gray-300 rounded focus:ring-indigo-500" /></div>
                                                            <div className="text-sm"><label htmlFor="mergeRemainder" className="font-medium text-gray-900">자투리 인원을 마지막 조에 합치기</label><p className="text-gray-500 mt-1">체크 시: 남은 인원이 별도 조가 되지 않고 마지막 조에 합류합니다.</p></div>
                                                        </div>
                                                    </div>
                                                    <div className="bg-blue-50 p-4 rounded-lg border border-blue-100">
                                                        <div className="text-sm">
                                                            <label className="font-medium text-gray-900 block mb-2">남녀 근무 방식 설정</label>
                                                            <div className="flex gap-4">
                                                                <label className="flex items-center gap-2 cursor-pointer"><input type="radio" name="genderRule" value="mixed" checked={config.genderRule === 'mixed'} onChange={handleConfigChange} className="text-indigo-600 focus:ring-indigo-500" /><span>혼성 근무</span></label>
                                                                <label className="flex items-center gap-2 cursor-pointer"><input type="radio" name="genderRule" value="separate" checked={config.genderRule === 'separate'} onChange={handleConfigChange} className="text-indigo-600 focus:ring-indigo-500" /><span>남녀 분리 (엄격)</span></label>
                                                            </div>
                                                            <p className="text-gray-500 mt-1">분리 시 짝꿍을 제외하곤 남녀가 절대 섞이지 않도록 팀을 나눕니다.</p>
                                                        </div>
                                                    </div>
                                                </div>
                                            </section>
                                            <hr className="border-gray-100" />
                                            <section>
                                                <div className="flex justify-between items-center mb-4">
                                                    <h3 className="text-sm font-bold text-gray-900 uppercase tracking-wider">장소 설정 (1~5곳)</h3>
                                                    <div className="flex items-center gap-2 bg-gray-100 p-1 rounded-lg">
                                                        <button onClick={() => updateLocations(config.locationCount - 1)} className="w-8 h-8 flex items-center justify-center rounded-md bg-white shadow-sm text-gray-600 hover:text-indigo-600">-</button>
                                                        <span className="w-8 text-center font-bold">{config.locationCount}</span>
                                                        <button onClick={() => updateLocations(config.locationCount + 1)} className="w-8 h-8 flex items-center justify-center rounded-md bg-white shadow-sm text-gray-600 hover:text-indigo-600">+</button>
                                                    </div>
                                                </div>
                                                <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-3">
                                                    {locations.map((loc, idx) => (
                                                        <div key={idx} className="flex items-center gap-2"><span className="text-gray-400 text-sm w-12">장소 {idx + 1}</span><input type="text" value={loc} onChange={(e) => handleLocationNameChange(idx, e.target.value)} className="flex-1 border border-gray-300 rounded-lg p-2 focus:ring-2 focus:ring-indigo-500 outline-none" placeholder="예: 정문, 후문, 로비" /></div>
                                                    ))}
                                                </div>
                                            </section>
                                        </div>
                                    )}
                                    {activeTab === 'participants' && (
                                        <div className="flex flex-col h-full">
                                            <div className="flex gap-2 mb-4 p-1 bg-gray-100 rounded-lg w-fit">
                                                <button onClick={() => setGenderTab('M')} className={`px-4 py-2 rounded-md text-sm font-bold transition flex items-center gap-2 ${genderTab === 'M' ? 'bg-white text-blue-600 shadow-sm' : 'text-gray-500 hover:text-gray-700'}`}>남성 (Male)</button>
                                                <button onClick={() => setGenderTab('F')} className={`px-4 py-2 rounded-md text-sm font-bold transition flex items-center gap-2 ${genderTab === 'F' ? 'bg-white text-pink-600 shadow-sm' : 'text-gray-500 hover:text-gray-700'}`}>여성 (Female)</button>
                                            </div>
                                            <div className="mb-4">
                                                <div className="flex gap-2">
                                                    <input type="text" value={newNameInput} onChange={(e) => setNewNameInput(e.target.value)} onKeyDown={handleAddParticipant} placeholder={`이름을 입력하고 엔터를 누르면 ${genderTab === 'M' ? '남성' : '여성'} 목록에 추가됩니다.`} className="flex-1 border border-indigo-200 rounded-lg px-4 py-3 focus:ring-2 focus:ring-indigo-500 outline-none shadow-sm" />
                                                    <button onClick={() => handleAddParticipant({ key: 'Enter', preventDefault: () => {} })} className="bg-indigo-600 text-white px-6 py-2 rounded-lg hover:bg-indigo-700 font-medium whitespace-nowrap">추가</button>
                                                </div>
                                            </div>
                                            <div className="flex-1 overflow-y-auto border border-gray-200 rounded-xl bg-gray-50">
                                                {filteredParticipants.length === 0 ? (
                                                    <div className="h-full flex flex-col items-center justify-center text-gray-400 p-8"><Users className="w-12 h-12 mb-2 opacity-20" /><p>등록된 {genderTab === 'M' ? '남성' : '여성'} 참여자가 없습니다.</p></div>
                                                ) : (
                                                    <div className="divide-y divide-gray-100">
                                                        {filteredParticipants.map((p) => (
                                                            <div key={p.id} className="bg-white p-4 flex flex-col xl:flex-row items-start xl:items-center gap-4 hover:bg-gray-50 transition">
                                                                <div className="flex flex-col gap-2 flex-1 w-full xl:w-auto">
                                                                    <div className="flex items-center gap-3">
                                                                        <span className={`w-8 h-8 rounded-full flex items-center justify-center text-xs font-bold text-white shrink-0 ${p.gender === 'M' ? 'bg-blue-400' : 'bg-pink-400'}`}>{p.gender}</span>
                                                                        <input type="text" value={p.name} onChange={(e) => updateParticipant(p.id, 'name', e.target.value)} className="font-medium text-gray-900 border-none bg-transparent focus:ring-0 p-0 hover:underline cursor-text w-24 sm:w-32" />
                                                                    </div>
                                                                    <div className="flex items-center gap-2">
                                                                        <div className="flex items-center gap-2 text-sm text-gray-500 bg-gray-100 px-2 py-1 rounded">
                                                                            <LinkIcon className="w-3 h-3" />
                                                                            <select value={p.partnerId || ""} onChange={(e) => updateParticipant(p.id, 'partnerId', e.target.value)} className="bg-transparent border-none p-0 text-sm w-20 sm:w-24 focus:ring-0 cursor-pointer">
                                                                                <option value="">짝꿍 없음</option>
                                                                                {participants.filter(u => u.id !== p.id).map(u => <option key={u.id} value={u.id}>{u.name} ({u.gender})</option>)}
                                                                            </select>
                                                                        </div>
                                                                        <div className="flex items-center gap-2 text-sm text-gray-500 bg-gray-100 px-2 py-1 rounded">
                                                                            <Lock className="w-3 h-3 text-gray-400" />
                                                                            <select value={p.preferredLocation || ""} onChange={(e) => updateParticipant(p.id, 'preferredLocation', e.target.value)} className="bg-transparent border-none p-0 text-sm w-20 sm:w-24 focus:ring-0 cursor-pointer">
                                                                                <option value="">장소 미지정</option>
                                                                                {locations.map((loc, idx) => <option key={idx} value={idx}>{loc} (고정)</option>)}
                                                                            </select>
                                                                        </div>
                                                                    </div>
                                                                </div>
                                                                <div className="flex items-center gap-2 sm:gap-4 w-full xl:w-auto justify-between xl:justify-start">
                                                                    <label className="flex items-center gap-2 cursor-pointer select-none">
                                                                        <button onClick={() => toggleTimeSettings(p.id)} className={`transition ${p.useDefaultTime ? 'text-gray-300' : 'text-indigo-600'}`}>{p.useDefaultTime ? <Circle className="w-5 h-5" /> : <CheckCircle2 className="w-5 h-5" />}</button>
                                                                        <span className="text-sm text-gray-500 whitespace-nowrap">개별 시간</span>
                                                                    </label>
                                                                    <div className={`flex items-center gap-1 transition-all duration-200 ${p.useDefaultTime ? 'opacity-30 grayscale pointer-events-none' : 'opacity-100 pointer-events-auto'}`}>
                                                                        <input type="time" value={p.availStart} onChange={(e) => updateParticipant(p.id, 'availStart', e.target.value)} className="border border-gray-200 rounded px-2 py-1 text-sm text-gray-600 w-24" />
                                                                        <span className="text-gray-400">+</span>
                                                                        <select onChange={(e) => handleDurationChange(p.id, e.target.value)} className="border border-indigo-200 bg-indigo-50 rounded px-2 py-1 text-sm text-indigo-700 w-24 focus:ring-1 focus:ring-indigo-500 outline-none cursor-pointer" defaultValue="">
                                                                            <option value="" disabled>시간 선택</option><option value="60">1시간</option><option value="90">1.5시간</option><option value="120">2시간</option><option value="150">2.5시간</option><option value="180">3시간</option><option value="240">4시간</option>
                                                                        </select>
                                                                        <span className="text-gray-400">→</span>
                                                                        <input type="time" value={p.availEnd} onChange={(e) => updateParticipant(p.id, 'availEnd', e.target.value)} className="border border-gray-200 rounded px-2 py-1 text-sm text-gray-600 w-24" />
                                                                    </div>
                                                                    <button onClick={() => removeParticipant(p.id)} className="text-gray-300 hover:text-red-500 p-1"><Trash2 className="w-4 h-4" /></button>
                                                                </div>
                                                            </div>
                                                        ))}
                                                    </div>
                                                )}
                                            </div>
                                        </div>
                                    )}
                                </div>
                                <div className="p-4 border-t border-gray-200 bg-gray-50 rounded-b-2xl flex justify-end gap-3">
                                    <button onClick={() => setIsSetupOpen(false)} className="px-5 py-2.5 text-gray-600 font-medium hover:bg-gray-200 rounded-lg transition">닫기</button>
                                    <button onClick={() => { generateSchedule(); setIsSetupOpen(false); }} className="px-6 py-2.5 bg-indigo-600 text-white font-medium rounded-lg hover:bg-indigo-700 shadow-lg shadow-indigo-200 transition flex items-center gap-2"><Save className="w-4 h-4" /> 설정 저장 및 스케줄 생성</button>
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<ShiftScheduler />);
    </script>
</body>
</html>
