<html lang="ko">
<head>

    <style>
        /* Modern & Accessible Font Stack */

            font-family: "Pretendard", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; 
            -webkit-font-smoothing: antialiased;

        /* Large Inputs for Accessibility */

            background-color: white;

            outline: none;
            box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.1);
        }
        
        /* Select arrow fix */
        select.modern-input {
            background-image: url("data:image/svg+xml,%3csvg xmlns='http://www.w3.org/2000/svg' fill='none' viewBox='0 0 20 20'%3e%3cpath stroke='%236b7280' stroke-linecap='round' stroke-linejoin='round' stroke-width='1.5' d='M6 8l4 4 4-4'/%3e%3c/svg%3e");
            background-position: right 0.5rem center;
            background-repeat: no-repeat;

        /* Accessible Buttons */

            padding: 10px 20px;
            transition: all 0.2s;
            display: inline-flex;

        /* Table enhancements */

            left: 0;
            background-color: #F9FAFB;

        .sticky-col-cell {

</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef, useMemo } = React;

        // --- 아이콘 컴포넌트 ---
        const IconBase = ({ children, ...props }) => (
            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" {...props}>
                {children}
            </svg>
        );

        const Icons = {
            Settings: (props) => <IconBase {...props}><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.47a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/><circle cx="12" cy="12" r="3"/></IconBase>,
            MapPin: (props) => <IconBase {...props}><path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0Z"/><circle cx="12" cy="10" r="3"/></IconBase>,
            Clock: (props) => <IconBase {...props}><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></IconBase>,
            Phone: (props) => <IconBase {...props}><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"/></IconBase>,
            Shuffle: (props) => <IconBase {...props}><path d="M2 18h1.4c1.3 0 2.5-.6 3.3-1.7l10.6-12.6c.7-1.1 1.9-1.7 3.3-1.7H22"/><path d="M2 6h1.4c1.3 0 2.5.6 3.3 1.7l10.6 12.6c.7 1.1 1.9 1.7 3.3 1.7H22"/></IconBase>,
            Rotate: (props) => <IconBase {...props}><path d="M21 12a9 9 0 1 1-9-9c2.52 0 4.93 1 6.74 2.74L21 8"/><path d="M21 3v5h-5"/></IconBase>,
            Users: (props) => <IconBase {...props}><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></IconBase>,
            Plus: (props) => <IconBase {...props}><path d="M5 12h14"/><path d="M12 5v14"/></IconBase>,
            Trash2: (props) => <IconBase {...props}><path d="M3 6h18"/><path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"/><path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"/><line x1="10" x2="10" y1="11" y2="17"/><line x1="14" x2="14" y1="11" y2="17"/></IconBase>,
            Save: (props) => <IconBase {...props}><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><polyline points="17 21 17 13 7 13 7 21"/><polyline points="7 3 7 8 15 8"/></IconBase>,
            X: (props) => <IconBase {...props}><path d="M18 6 6 18"/><path d="m6 6 12 12"/></IconBase>,
            CheckCircle2: (props) => <IconBase {...props}><path d="M12 22c5.523 0 10-4.477 10-10S17.523 2 12 2 2 6.477 2 12s4.477 10 10 10z"/><path d="m9 12 2 2 4-4"/></IconBase>,
            Circle: (props) => <IconBase {...props}><circle cx="12" cy="12" r="10"/></IconBase>,
            AlertCircle: (props) => <IconBase {...props}><circle cx="12" cy="12" r="10"/><line x1="12" x2="12" y1="8" y2="12"/><line x1="12" x2="12.01" y1="16" y2="16"/></IconBase>,
            LinkIcon: (props) => <IconBase {...props}><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/></IconBase>,
            Share2: (props) => <IconBase {...props}><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><line x1="8.59" x2="15.42" y1="13.51" y2="17.49"/><line x1="15.41" x2="8.59" y1="6.51" y2="10.49"/></IconBase>,
            Copy: (props) => <IconBase {...props}><rect width="14" height="14" x="8" y="8" rx="2" ry="2"/><path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2"/></IconBase>,
            Calculator: (props) => <IconBase {...props}><rect width="16" height="20" x="4" y="2" rx="2"/><line x1="8" x2="16" y1="6" y2="6"/><line x1="16" x2="16" y1="14" y2="18"/><path d="M16 10h.01"/><path d="M12 10h.01"/><path d="M8 10h.01"/><path d="M12 14h.01"/><path d="M8 14h.01"/><path d="M12 18h.01"/><path d="M8 18h.01"/></IconBase>,
            Lock: (props) => <IconBase {...props}><rect width="18" height="11" x="3" y="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></IconBase>,
            AlertTriangle: (props) => <IconBase {...props}><path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3Z"/><line x1="12" x2="12" y1="9" y2="13"/><line x1="12" x2="12.01" y1="17" y2="17"/></IconBase>,
            ImageDown: (props) => <IconBase {...props}><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" x2="12" y1="15" y2="3"/></IconBase>,
            TrashAll: (props) => <IconBase {...props}><path d="M3 6h18"/><path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"/><path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"/><line x1="10" x2="10" y1="11" y2="17"/><line x1="14" x2="14" y1="11" y2="17"/></IconBase>
        };

        const { 
            Settings, MapPin, Clock, Phone, Shuffle, Users, Plus, Trash2, 
            Save, X, CheckCircle2, Circle, AlertCircle, LinkIcon, Share2, Copy, 
            Calculator, Lock, Rotate, AlertTriangle, ImageDown, TrashAll
        } = Icons;


        // --- 유틸리티 함수 ---

        const timeToMinutes = (time) => {
            if (!time) return 0;
            const [h, m] = time.split(':').map(Number);
            return h * 60 + m;
        };

        const getEndTimeMinutes = (time) => {
            if (!time) return 0;
            const mins = timeToMinutes(time);
            return (mins === 0 && time === '00:00') ? 24 * 60 : mins;
        };

        const minutesToTime = (minutes) => {
            let h = Math.floor(minutes / 60);
            const m = minutes % 60;
            if (h >= 24) h = h % 24; 
            return `${String(h).padStart(2, '0')}:${String(m).padStart(2, '0')}`;
        };

        const generateTimeSlots = (start, end, interval) => {
            const slots = [];
            let current = timeToMinutes(start);
            const endTime = getEndTimeMinutes(end);

            while (current < endTime) {
                slots.push(minutesToTime(current));
                current += parseInt(interval);
            }
            return slots;
        };

        const shuffleArray = (array) => {
            let currentIndex = array.length, randomIndex;
            while (currentIndex !== 0) {
                randomIndex = Math.floor(Math.random() * currentIndex);
                currentIndex--;
                [array[currentIndex], array[randomIndex]] = [array[randomIndex], array[currentIndex]];
            }
            return array;
        };
        
        // 10분 단위 시간 생성 유틸 (전체)
        const generateAllTimeOptions = () => {
            const options = [];
            for (let h = 0; h < 24; h++) {
                for (let m = 0; m < 60; m += 10) {
                    const timeStr = `${String(h).padStart(2, '0')}:${String(m).padStart(2, '0')}`;
                    options.push(timeStr);
                }
            }
            options.push("00:00");
            return options;
        };

        // 범위 내 시간 생성 유틸
        const generateRestrictedTimeOptions = (startStr, endStr) => {
            const options = [];
            const startMins = timeToMinutes(startStr);
            const endMins = getEndTimeMinutes(endStr);
            
            for (let h = 0; h < 24; h++) {
                for (let m = 0; m < 60; m += 10) {
                    const currentMins = h * 60 + m;
                    if (currentMins >= startMins && currentMins <= endMins) {
                        const timeStr = `${String(h).padStart(2, '0')}:${String(m).padStart(2, '0')}`;
                        options.push(timeStr);
                    }
                }
            }
            if (endMins >= 24 * 60) options.push("00:00");
            
            return options;
        };

        const allTimeOptions = generateAllTimeOptions();

        const TimeSelect = ({ value, onChange, className, options }) => (
            <select value={value} onChange={onChange} className={className}>
                {(options || allTimeOptions).map((t) => (
                    <option key={t} value={t}>{t}</option>
                ))}
            </select>
        );
        
        const ToggleSwitch = ({ checked, onChange, id }) => (
            <div className="relative inline-block w-[52px] h-[32px] align-middle select-none transition duration-200 ease-in">
                <input 
                    type="checkbox" 
                    id={id} 
                    className="toggle-checkbox absolute block w-7 h-7 rounded-full bg-white border-4 appearance-none cursor-pointer peer checked:right-0 right-[20px] top-[2px] z-10 transition-all duration-200"
                    checked={checked} 
                    onChange={onChange} 
                    style={{ right: checked ? '2px' : 'calc(100% - 30px)' }}
                />
                <label 
                    htmlFor={id} 
                    className={`toggle-label block overflow-hidden h-8 rounded-full cursor-pointer border border-gray-200 transition-colors duration-200 ${checked ? 'bg-green-500' : 'bg-gray-200'}`}
                ></label>
            </div>
        );


        // --- 메인 컴포넌트 ---
        function ShiftScheduler() {
            const [config, setConfig] = useState({
                startTime: '10:00', 
                endTime: '12:00', 
                interval: 15, 
                peoplePerShift: 2,
                locationCount: 1, 
                mergeRemainder: true, 
                genderRule: 'mixed', 
            });

            const [manager, setManager] = useState({
                name: '',
                phone: '',
            });

            const [locations, setLocations] = useState(['장소1']);

            const [participants, setParticipants] = useState([
                { id: 1, name: '모세', gender: 'M', availStart: '10:00', availEnd: '12:00', useDefaultTime: true, partnerId: null, preferredLocation: '' },
                { id: 2, name: '사라', gender: 'F', availStart: '10:00', availEnd: '12:00', useDefaultTime: true, partnerId: null, preferredLocation: '' },
                { id: 3, name: '요셉', gender: 'M', availStart: '10:00', availEnd: '12:00', useDefaultTime: true, partnerId: null, preferredLocation: '' },
                { id: 4, name: '리브가', gender: 'F', availStart: '10:00', availEnd: '12:00', useDefaultTime: true, partnerId: null, preferredLocation: '' },
                { id: 5, name: '다윗', gender: 'M', availStart: '10:00', availEnd: '12:00', useDefaultTime: true, partnerId: null, preferredLocation: '' },
                { id: 6, name: '한나', gender: 'F', availStart: '10:00', availEnd: '12:00', useDefaultTime: true, partnerId: null, preferredLocation: '' },
                { id: 7, name: '다니엘', gender: 'M', availStart: '10:00', availEnd: '12:00', useDefaultTime: true, partnerId: null, preferredLocation: '' },
                { id: 8, name: '에스더', gender: 'F', availStart: '10:00', availEnd: '12:00', useDefaultTime: true, partnerId: null, preferredLocation: '' },
                { id: 9, name: '바울', gender: 'M', availStart: '10:00', availEnd: '12:00', useDefaultTime: true, partnerId: null, preferredLocation: '' },
                { id: 10, name: '룻', gender: 'F', availStart: '10:00', availEnd: '12:00', useDefaultTime: true, partnerId: null, preferredLocation: '' },
            ]);

            const [schedule, setSchedule] = useState({});
            const [isSetupOpen, setIsSetupOpen] = useState(true);
            const [activeTab, setActiveTab] = useState('basic'); 
            const [genderTab, setGenderTab] = useState('M'); 
            const [newNameInput, setNewNameInput] = useState(''); 
            const [rotationStep, setRotationStep] = useState(0);
            const [shuffleCount, setShuffleCount] = useState(0); 
            const [alertData, setAlertData] = useState({ isOpen: false, missing: [], suggestion: "" });
            
            const scheduleRef = useRef(null);

            const restrictedTimeOptions = useMemo(() => {
                return generateRestrictedTimeOptions(config.startTime, config.endTime);
            }, [config.startTime, config.endTime]);

            const preprocessParticipants = (originalList, genderRule, peoplePerShift) => {
                let processedList = [...originalList];
                
                if (shuffleCount > 0) {
                    processedList = shuffleArray(processedList);
                }

                const units = [];
                const visited = new Set();

                processedList.forEach(p => { 
                    if (visited.has(p.id)) return;
                    
                    const unit = [p];
                    visited.add(p.id);

                    if (p.partnerId) {
                        const partner = processedList.find(u => u.id === parseInt(p.partnerId)); 
                        if (partner && !visited.has(partner.id)) {
                            unit.push(partner);
                            visited.add(partner.id);
                        }
                    }
                    units.push(unit);
                });

                units.sort((a, b) => {
                    const getLocIndex = (unit) => {
                        const p1 = unit[0].preferredLocation;
                        if (p1 !== '' && p1 !== undefined) return parseInt(p1);
                        if (unit.length > 1) {
                            const p2 = unit[1].preferredLocation;
                            if (p2 !== '' && p2 !== undefined) return parseInt(p2);
                        }
                        return 999; 
                    };
                    return getLocIndex(a) - getLocIndex(b);
                });

                if (genderRule === 'separate') {
                    const mixedUnits = units.filter(u => u.length > 1 && u[0].gender !== u[1].gender);
                    const maleUnits = units.filter(u => !mixedUnits.includes(u) && u[0].gender === 'M');
                    const femaleUnits = units.filter(u => !mixedUnits.includes(u) && u[0].gender === 'F');

                    const interleaved = [...mixedUnits];
                    let mIdx = 0;
                    let fIdx = 0;
                    
                    while (mIdx < maleUnits.length || fIdx < femaleUnits.length) {
                        if (mIdx < maleUnits.length) {
                            let count = 0;
                            while (mIdx < maleUnits.length && count < peoplePerShift) {
                                interleaved.push(maleUnits[mIdx]);
                                count += maleUnits[mIdx].length;
                                mIdx++;
                            }
                        }
                        if (fIdx < femaleUnits.length) {
                            let count = 0;
                            while (fIdx < femaleUnits.length && count < peoplePerShift) {
                                interleaved.push(femaleUnits[fIdx]);
                                count += femaleUnits[fIdx].length;
                                fIdx++;
                            }
                        }
                    }
                    return interleaved.flat();
                } else {
                    return units.flat();
                }
            };

            const createTeams = (people, size, merge, genderRule) => {
                const teams = [];
                if (people.length === 0) return [];
                
                let currentTeam = [];
                
                for (let i = 0; i < people.length; i++) {
                    const person = people[i];
                    
                    if (currentTeam.length === size) {
                        teams.push(currentTeam);
                        currentTeam = [];
                    }

                    if (currentTeam.length > 0) {
                        const firstMember = currentTeam[0];
                        const isPartner = (firstMember.partnerId && parseInt(firstMember.partnerId) === person.id) || 
                                          (person.partnerId && parseInt(person.partnerId) === firstMember.id);
                        
                        if (genderRule === 'separate' && !isPartner) {
                            if (firstMember.gender !== person.gender) {
                                teams.push(currentTeam);
                                currentTeam = [];
                            }
                        }

                        if (currentTeam.length > 0) { 
                            const currentRep = currentTeam[0]; 
                            const loc1 = currentRep.preferredLocation;
                            const loc2 = person.preferredLocation;

                            if (loc1 !== '' && loc2 !== '' && loc1 !== loc2 && !isPartner) {
                                teams.push(currentTeam);
                                currentTeam = [];
                            }
                        }
                    }

                    currentTeam.push(person);
                }

                if (currentTeam.length > 0) {
                    teams.push(currentTeam);
                }
                return teams;
            };

            const generateSchedule = () => {
                const timeSlots = generateTimeSlots(config.startTime, config.endTime, config.interval);
                const newSchedule = {};
                
                const processedPeople = preprocessParticipants(participants, config.genderRule, parseInt(config.peoplePerShift));
                let teams = createTeams(processedPeople, parseInt(config.peoplePerShift), config.mergeRemainder, config.genderRule);
                
                if (teams.length === 0) {
                    setSchedule({});
                    return;
                }

                if (rotationStep > 0) {
                    const rotateCount = rotationStep % teams.length;
                    teams = [...teams.slice(rotateCount), ...teams.slice(0, rotateCount)];
                }

                let teamIndex = 0; 
                const assignedPersonIds = new Set();

                timeSlots.forEach((time, tIdx) => {
                    newSchedule[time] = {};
                    const currentSlotMinutes = timeToMinutes(time);
                    const nextSlotMinutes = currentSlotMinutes + parseInt(config.interval);

                    const currentAssignments = []; 
                    locations.forEach((_, idx) => currentAssignments.push({ locIndex: idx, members: [] }));
                    
                    // [Step 0: Fixed Time Assignment - UNCONDITIONAL PRIORITY]
                    const fixedTimeUsers = participants.filter(p => !p.useDefaultTime);
                    fixedTimeUsers.forEach(user => {
                        const pStart = timeToMinutes(user.availStart);
                        const pEnd = getEndTimeMinutes(user.availEnd);
                        
                        if (currentSlotMinutes >= pStart && nextSlotMinutes <= pEnd) {
                            let targetLocIdx = 0;
                            if (user.preferredLocation !== '' && user.preferredLocation !== undefined) {
                                targetLocIdx = parseInt(user.preferredLocation);
                            }
                            
                            // 무조건 배치 (인원 제한 무시 - Fixed Time Priority)
                            // [Updated] 이미 해당 위치에 배정되었는지 중복 체크를 강화합니다.
                            // currentAssignments 전체를 확인하여 이미 배치된 인원은 건너뜁니다.
                            let isAlreadyAssigned = false;
                            currentAssignments.forEach(ass => {
                                if (ass.members.some(m => m.id === user.id)) isAlreadyAssigned = true;
                            });

                            if (!isAlreadyAssigned) {
                                currentAssignments[targetLocIdx].members.push(user);
                            }

                            // [New Logic] 짝꿍 가용성 교차 검증 (Intersection Check)
                            if (user.partnerId) {
                                const partner = participants.find(p => p.id === parseInt(user.partnerId));
                                if (partner) {
                                    // 짝꿍도 이 시간에 가능한가?
                                    let partnerStart = timeToMinutes(config.startTime);
                                    let partnerEnd = getEndTimeMinutes(config.endTime);

                                    if (!partner.useDefaultTime) {
                                        partnerStart = timeToMinutes(partner.availStart);
                                        partnerEnd = getEndTimeMinutes(partner.availEnd);
                                    }

                                    // 둘 다 가능한 시간일 때만 짝꿍도 함께 배치
                                    if (currentSlotMinutes >= partnerStart && nextSlotMinutes <= partnerEnd) {
                                        // 중복 방지 체크 후 추가 (짝꿍이 다른 고정 시간 로직에 의해 이미 들어갔을 수 있음)
                                        let isPartnerAlreadyAssigned = false;
                                        currentAssignments.forEach(ass => {
                                            if (ass.members.some(m => m.id === partner.id)) isPartnerAlreadyAssigned = true;
                                        });

                                        if (!isPartnerAlreadyAssigned) {
                                            currentAssignments[targetLocIdx].members.push(partner);
                                        }
                                    }
                                }
                            }
                        }
                    });

                    
                    const floaters = [];

                    if (config.genderRule === 'separate' && locations.length > 1) {
                        if (tIdx % 2 !== 0) teamIndex++; 
                    }

                    // 1. 완전한 팀 우선 배정
                    for (let i = 0; i < locations.length; i++) {
                        // [Updated] 정량 배정(Merge OFF)일 때는 정원 초과 금지 (이미 고정 인원으로 꽉 찼으면 패스)
                        // 균등 배분(Merge ON)일 때는 조금 넘쳐도 허용
                        const limit = config.mergeRemainder ? parseInt(config.peoplePerShift) + 1 : parseInt(config.peoplePerShift);
                        
                        // [New Rule Added] 설정한 인원/조와 상관없이 배치되는 오류 수정
                        // 이미 고정 인원(Step 0)에 의해 자리가 찼다면 건너뜀
                        if (currentAssignments[i].members.length >= limit) continue;

                        let attempts = 0;
                        while (attempts < teams.length) {
                            const candidateTeam = teams[teamIndex % teams.length];
                            
                            const validMembers = candidateTeam.filter(p => {
                                if (!p.useDefaultTime) return false;

                                const pStart = timeToMinutes(config.startTime);
                                const pEnd = getEndTimeMinutes(config.endTime);
                                
                                const isTimeOk = currentSlotMinutes >= pStart && nextSlotMinutes <= pEnd;
                                const isLocOk = p.preferredLocation === '' || p.preferredLocation === undefined || parseInt(p.preferredLocation) === i;
                                
                                let isAssignedElsewhere = false;
                                currentAssignments.forEach(ass => {
                                    if (ass.members.some(m => m.id === p.id)) isAssignedElsewhere = true;
                                });

                                return isTimeOk && isLocOk && !isAssignedElsewhere;
                            });

                            teamIndex++;
                            attempts++;

                            if (validMembers.length > 0 && validMembers.length === candidateTeam.length) {
                                // 남은 자리에 들어갈 수 있는지 체크
                                if (currentAssignments[i].members.length + validMembers.length <= limit) { 
                                    currentAssignments[i].members.push(...validMembers);
                                    break; 
                                } else {
                                    // 자리가 부족하면 Floater로
                                    floaters.push(...validMembers);
                                }
                            } else {
                                if (validMembers.length > 0) {
                                    floaters.push(...validMembers);
                                }
                            }
                        }
                    }

                    // [New] 1.5 Priority Pairing (우선 순위 짝짓기)
                    // - 1순위: 1인 팀 합류 (혼자 근무하는 것 방지)
                    // - 2순위: 빈 장소가 아닌 곳에 합류 (빈 장소 최소화)
                    // - 3순위: 팀 흡수 (Overfill)
                    
                    const MAX_LIMIT = parseInt(config.peoplePerShift);

                    while (floaters.length > 0) {
                        const person = floaters[0];
                        let matched = false;

                        // 1순위: 1인 팀 찾기 (짝을 맞춰주기 위함)
                        const loneWolfGroup = currentAssignments.find(g => g.members.length === 1);
                        if (loneWolfGroup) {
                            loneWolfGroup.members.push(person);
                            floaters.shift();
                            continue;
                        }

                        // 2순위: 정원 미달인 팀 찾기 (빈 장소가 아닌 곳)
                        const roomWithSpace = currentAssignments.find(g => g.members.length > 0 && g.members.length < MAX_LIMIT);
                        if (roomWithSpace) {
                            roomWithSpace.members.push(person);
                            floaters.shift();
                            continue;
                        }

                        // 3순위: 아예 비어있는 곳 (새로운 팀 결성) - 기존 로직 Step 2에서 처리
                        // 여기서는 일단 패스하고 Floaters로 남겨둠
                        break; 
                    }

                    // 2. Floater 재조합
                    const emptyLocations = currentAssignments.filter(a => a.members.length === 0);
                    while (emptyLocations.length > 0 && floaters.length >= 2) {
                        const p1 = floaters[0];
                        const p2 = floaters[1];
                        const targetLoc = emptyLocations.shift();
                        if(targetLoc) {
                            targetLoc.members.push(p1, p2);
                            floaters.splice(0, 2);
                        }
                    }

                    // 3. 남은 Floater 배분
                    while (floaters.length > 0) {
                        const person = floaters.shift();
                        let target = null;

                        const activeGroups = currentAssignments.filter(g => g.members.length > 0);
                        const emptyGroups = currentAssignments.filter(g => g.members.length === 0);
                        
                        const onePersonGroup = activeGroups.find(g => g.members.length === 1);
                        if (onePersonGroup) {
                            target = onePersonGroup;
                        } 
                        else if (activeGroups.length > 0) {
                             activeGroups.sort((a, b) => a.members.length - b.members.length);
                             
                             // [Updated Filter Logic]
                             // 균등 배분(Merge ON)이거나, 대상이 여성(F)인 경우 => 무조건 흡수 (빈 방 생성 X)
                             const forceAbsorb = config.mergeRemainder || person.gender === 'F';

                             if (forceAbsorb) {
                                // 무조건 기존 팀 중 가장 적은 곳으로 (과밀 허용)
                                target = activeGroups[0];
                             }
                             else if (!config.mergeRemainder && activeGroups[0].members.length >= parseInt(config.peoplePerShift)) {
                                 // 정량 배정이고 꽉 찼으면 -> 새 방으로 (단, 남성일 때만)
                                 if (emptyGroups.length > 0 && person.gender === 'M') {
                                     target = emptyGroups[0];
                                 } else {
                                     target = activeGroups[0]; // 어쩔 수 없이 과밀
                                 }
                             } else {
                                 target = activeGroups[0];
                             }
                        } 
                        else if (emptyGroups.length > 0) {
                             // 활성화된 그룹이 없는데 빈 방이 있는 경우 (첫 배정 등)
                             // 여성이면 혼자 들어갈 수 없으므로 일단 넣되, 추후 Safety Check에서 처리됨
                             target = emptyGroups[0];
                        }

                        if (target) {
                            target.members.push(person);
                        } else {
                            // 갈 곳이 없는 경우 (방도 없고 팀도 없음 - 예외 케이스)
                            // 버려질 수 없으므로 임의 배정
                            if (activeGroups.length > 0) activeGroups[0].members.push(person);
                        }
                    }

                    // 4. 여성 1인 근무 방지
                    currentAssignments.forEach(assignment => {
                        if (assignment.members.length === 1 && assignment.members[0].gender === 'F') {
                            const loneFemale = assignment.members.pop(); 
                            const otherGroups = currentAssignments.filter(g => g !== assignment && g.members.length > 0);
                            if (otherGroups.length > 0) {
                                otherGroups.sort((a, b) => a.members.length - b.members.length);
                                otherGroups[0].members.push(loneFemale);
                            } else {
                                assignment.members.push(loneFemale);
                            }
                        }
                    });

                    // 5. 비움 방지를 위한 남성 인원 재배치
                    if (!config.mergeRemainder) {
                        const finalEmptyGroups = currentAssignments.filter(g => g.members.length === 0);
                        if (finalEmptyGroups.length > 0) {
                            for (const emptyGroup of finalEmptyGroups) {
                                let donorGroup = currentAssignments.find(g => g.members.length > parseInt(config.peoplePerShift) && g.members.some(m => m.gender === 'M'));
                                
                                if (!donorGroup) {
                                    donorGroup = currentAssignments.find(g => {
                                        if (g.members.length < 2) return false;
                                        const maleIndex = g.members.findIndex(m => m.gender === 'M');
                                        if (maleIndex === -1) return false;
                                        const remainingMembers = [...g.members];
                                        remainingMembers.splice(maleIndex, 1);
                                        if (remainingMembers.length === 1 && remainingMembers[0].gender === 'F') return false;
                                        return true;
                                    });
                                }

                                if (donorGroup) {
                                    const maleIndex = donorGroup.members.findIndex(m => m.gender === 'M');
                                    const movedMan = donorGroup.members.splice(maleIndex, 1)[0];
                                    emptyGroup.members.push(movedMan);
                                }
                            }
                        }
                    }

                    // [New Step 5.5] Final Safety Check (여성 1인 근무 절대 방어 & 고립 방지)
                    // 위 모든 로직을 거쳤음에도 여성 혼자 남은 경우 -> 무조건 다른 방으로 강제 이동
                    // 만약 이동할 다른 방이 전혀 없다면 (전체 인원이 1명뿐인 경우 등) -> 해당 시간 배정에서 제외 (Safety First)
                    currentAssignments.forEach(assignment => {
                        if (assignment.members.length === 1 && assignment.members[0].gender === 'F') {
                            const female = assignment.members.pop();
                            
                            // 인원이 가장 많은 방을 찾아서 보냄 (안전함 우선)
                            const bestGroup = currentAssignments
                                .filter(g => g !== assignment && g.members.length > 0)
                                .sort((a, b) => b.members.length - a.members.length)[0];
                                
                            if (bestGroup) {
                                bestGroup.members.push(female);
                            } else {
                                // 다른 방도 다 비어있다면? (전체 인원이 1명뿐인 경우)
                                // "절대 여자가 배치되어서는 안돼" 규칙에 따라 과감히 배정 취소 (휴식 처리)
                                // 만약 배정하려면 남성 1인 팀이어야 하는데, 여성이므로 불가.
                                // floaters에 다시 넣지 않고 증발시킴 (Safety Drop)
                                console.warn(`[Safety Check] ${female.name} removed from ${time} slot to prevent lone female assignment.`);
                            }
                        }
                    });
                    
                    currentAssignments.forEach(ass => {
                        ass.members.forEach(m => assignedPersonIds.add(m.id));
                    });

                    currentAssignments.forEach((assignment, idx) => {
                        const locName = locations[idx];
                        newSchedule[time][locName] = assignment.members.length > 0 ? assignment.members : [null];
                    });
                });
                
                setSchedule(newSchedule);
                
                const missing = participants.filter(p => !assignedPersonIds.has(p.id));
                if (missing.length > 0) {
                    let suggestion = `현재 장소와 시간으로는 ${participants.length}명을 모두 수용하기 어렵습니다.\n`;
                    suggestion += `💡 제안: 근무 장소를 늘리거나, 타임당 인원을 늘려보세요.\n`;
                    suggestion += `⚠️ 여성 1인 단독 근무 불가 원칙에 의해 배정에서 제외된 경우에도 이 알림이 뜹니다.`;
                    
                    setAlertData({ 
                        isOpen: true, 
                        missing: missing.map(m => m.name),
                        suggestion: suggestion 
                    });
                } else {
                    setAlertData({ isOpen: false, missing: [], suggestion: "" });
                }
            };

            const handleDownloadImage = async () => {
                if (!scheduleRef.current) return;
                
                try {
                    // [Updated] 이미지 저장 품질 및 레이아웃 깨짐 방지 옵션 추가
                    const canvas = await html2canvas(scheduleRef.current, {
                        scale: 2, // 고해상도
                        backgroundColor: "#ffffff",
                        useCORS: true, // 외부 이미지 허용
                        scrollY: 0, // 스크롤 위치 초기화하여 캡처
                        scrollX: 0,
                        logging: false, // 로그 끄기
                        onclone: (clonedDoc) => {
                            // [Fix] 이미지 저장 시 sticky 요소가 깨지는 현상 방지
                            // 캡처용 복제본(clonedDoc)에서만 sticky 속성을 제거하여 정적으로 렌더링
                            const stickyElements = clonedDoc.querySelectorAll('.sticky-col-header, .sticky-col-cell');
                            stickyElements.forEach(el => {
                                el.style.position = 'static';
                                el.style.boxShadow = 'none'; // 그림자도 제거하여 깔끔하게
                                el.style.borderRight = '1px solid #e5e7eb'; // 테두리 유지
                            });
                            
                            // [Fix] 폰트 깨짐 방지를 위한 렌더링 힌트 추가
                            const body = clonedDoc.body;
                            body.style.fontFeatureSettings = '"liga" 0';
                            body.style.fontVariantLigatures = 'none';
                            body.style.webkitFontSmoothing = 'antialiased';
                        }
                    });
                    
                    const image = canvas.toDataURL("image/png");
                    const link = document.createElement("a");
                    link.href = image;
                    link.download = `근무표_${new Date().toISOString().split('T')[0]}.png`;
                    link.click();
                } catch (error) {
                    console.error("이미지 저장 실패:", error);
                    alert("이미지 저장 중 오류가 발생했습니다.");
                }
            };

            const handleConfigChange = (e) => {
                const { name, value, type, checked } = e.target;
                setConfig(prev => ({ ...prev, [name]: type === 'checkbox' ? checked : value }));
            };

            const updateLocations = (count) => {
                const newCount = Math.min(10, Math.max(1, count));
                setConfig(prev => ({ ...prev, locationCount: newCount }));
                setLocations(prev => {
                    const newLocs = [...prev];
                    if (newCount > prev.length) {
                        for (let i = prev.length; i < newCount; i++) newLocs.push(`장소 ${i + 1}`);
                    } else {
                        newLocs.splice(newCount);
                    }
                    return newLocs;
                });
            };

            const handleLocationNameChange = (idx, val) => {
                const newLocs = [...locations];
                newLocs[idx] = val;
                setLocations(newLocs);
            };

            const handleAddParticipant = (e) => {
                if (e.key === 'Enter' && newNameInput.trim()) {
                    e.preventDefault();
                    const newId = participants.length > 0 ? Math.max(...participants.map(p => p.id)) + 1 : 1;
                    setParticipants([...participants, { 
                        id: newId, 
                        name: newNameInput.trim(), 
                        gender: genderTab, 
                        availStart: config.startTime, 
                        availEnd: config.endTime, 
                        useDefaultTime: true,
                        partnerId: null,
                        preferredLocation: '' 
                    }]);
                    setNewNameInput('');
                }
            };

            const removeParticipant = (id) => {
                setParticipants(participants.map(p => 
                    p.partnerId == id ? { ...p, partnerId: null } : p
                ).filter(p => p.id !== id));
            };
            
            // [Fixed] 전체 삭제 로직 - 현재 탭의 성별만 삭제
            const removeAllParticipants = () => {
                if (window.confirm(`${genderTab === 'M' ? '남성' : '여성'} 목록을 모두 삭제하시겠습니까?`)) {
                    setParticipants(prev => prev.filter(p => p.gender !== genderTab));
                }
            };

            // [New] 안전한 전체 삭제 핸들러 추가
            const handleSafeRemoveAll = (e) => {
                e.preventDefault();
                // 브라우저 기본 동작 방지 및 이벤트 전파 중단
                e.stopPropagation();
                
                if (window.confirm(`${genderTab === 'M' ? '남성' : '여성'} 목록을 정말 모두 삭제하시겠습니까?\n이 작업은 되돌릴 수 없습니다.`)) {
                    setParticipants(prev => prev.filter(p => p.gender !== genderTab));
                }
            };

            const updateParticipant = (id, field, value) => {
                setParticipants(participants.map(p => {
                    if (p.id === id) return { ...p, [field]: value };
                    if (field === 'partnerId' && p.id === parseInt(value)) return { ...p, partnerId: id };
                    return p;
                }));
            };

            const handleDurationChange = (id, minutesStr) => {
                const minutes = parseInt(minutesStr);
                if (isNaN(minutes)) return;
                setParticipants(participants.map(p => {
                    if (p.id === id) {
                        const startMins = timeToMinutes(p.availStart);
                        const newEndMins = startMins + minutes;
                        const newEnd = minutesToTime(newEndMins);
                        return { ...p, availEnd: newEnd, useDefaultTime: false }; 
                    }
                    return p;
                }));
            };

            const toggleTimeSettings = (id) => {
                setParticipants(participants.map(p => {
                    if (p.id === id) {
                        const newUseDefault = !p.useDefaultTime;
                        const nextStart = newUseDefault ? p.availStart : config.startTime;
                        const nextEnd = newUseDefault ? p.availEnd : config.endTime;
                        
                        return { 
                            ...p, 
                            useDefaultTime: newUseDefault,
                            availStart: nextStart,
                            availEnd: nextEnd
                        };
                    }
                    return p;
                }));
            };

            useEffect(() => {
                if (!isSetupOpen && participants.length > 0) generateSchedule();
            }, [isSetupOpen, shuffleCount, rotationStep]);

            const filteredParticipants = participants.filter(p => p.gender === genderTab);
            const maleCount = participants.filter(p => p.gender === 'M').length;
            const femaleCount = participants.filter(p => p.gender === 'F').length;

            const maxWidthClass = locations.length <= 1 ? "max-w-3xl" : "max-w-6xl";

            return (
                <div className="min-h-screen font-sans pb-10 flex flex-col bg-gray-50/50">
                    {/* Header */}
                    <header className="bg-white sticky top-0 z-20 border-b border-gray-200">
                        <div className={`mx-auto px-4 py-4 flex flex-col md:flex-row justify-between items-center gap-4 transition-all duration-300 ${maxWidthClass}`}>
                            <div className="flex items-center gap-3">
                            <div className="bg-gradient-to-br from-indigo-600 to-indigo-800 p-2.5 rounded-xl shadow-lg shadow-indigo-200">
                            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" className="w-7 h-7 text-white" fill="none" stroke="currentColor" stroke-width="5">
                                <path d="M30,10 L70,10 L70,30 L30,30 Z" fill="none" stroke="currentColor" stroke-width="5"/>
                                <path d="M30,30 L20,50 L80,50 L70,30" fill="none" stroke="currentColor" stroke-width="5"/>
                                <path d="M25,50 L15,70 L85,70 L75,50" fill="none" stroke="currentColor" stroke-width="5"/>
                                <path d="M20,70 L10,90 L90,90 L80,70" fill="none" stroke="currentColor" stroke-width="5"/>
                                <circle cx="25" cy="90" r="5" fill="currentColor" />
                                <circle cx="75" cy="90" r="5" fill="currentColor" />
                                <rect x="35" y="35" width="10" height="10" fill="none" stroke="currentColor" stroke-width="5"/>
                                <rect x="55" y="35" width="10" height="10" fill="none" stroke="currentColor" stroke-width="5"/>
                                <rect x="30" y="55" width="10" height="10" fill="none" stroke="currentColor" stroke-width="5"/>
                                <rect x="50" y="55" width="10" height="10" fill="none" stroke="currentColor" stroke-width="5"/>
                                <rect x="25" y="75" width="10" height="10" fill="none" stroke="currentColor" stroke-width="5"/>
                                <rect x="45" y="75" width="10" height="10" fill="none" stroke="currentColor" stroke-width="5"/>
                                <rect x="65" y="75" width="10" height="10" fill="none" stroke="currentColor" stroke-width="5"/>
                            </svg>
                        </div>
                                </div>
                                <h1 className="text-2xl font-extrabold tracking-tight text-gray-900"> 스마트 전시대 교대표 <span className="text-indigo-600">Pro</span></h1>
                            </div>
                            
                            <div className="flex flex-wrap justify-center gap-2">
                                <button onClick={() => setIsSetupOpen(true)} className="modern-btn bg-white border border-gray-300 text-gray-700 hover:bg-gray-50">
                                    <Settings className="w-5 h-5 mr-2" /> 설정
                                </button>
                                {/* 핵심 기능: 순서 섞기 유지 */}
                                <button onClick={() => setRotationStep(prev => prev + 1)} className="modern-btn bg-indigo-50 border border-indigo-100 text-indigo-700 hover:bg-indigo-100">
                                    <Rotate className="w-5 h-5 mr-2" /> 순서 섞기
                                </button>
                                {/* 핵심 기능: 짝 섞기 유지 */}
                                <button onClick={() => setShuffleCount(prev => prev + 1)} className="modern-btn bg-purple-50 border border-purple-100 text-purple-700 hover:bg-purple-100">
                                    <Shuffle className="w-5 h-5 mr-2" /> 짝 섞기
                                </button>
                                <button onClick={handleDownloadImage} className="modern-btn bg-yellow-400 text-yellow-950 hover:bg-yellow-500 border border-yellow-500 shadow-sm">
                                    <ImageDown className="w-5 h-5 mr-2" /> 이미지 저장
                                </button>
                            </div>
                        </div>
                    </header>

                    {/* Main Content */}
                    <main className={`mx-auto px-4 py-8 flex-1 w-full transition-all duration-300 ${maxWidthClass}`}>
                        
                        <div ref={scheduleRef} className="space-y-8 bg-gray-50/50 p-2 rounded-2xl">
                            {/* Status Cards */}
                            <div className="grid grid-cols-2 md:grid-cols-4 gap-4">
                                <div className="modern-card p-5 text-center">
                                    <p className="text-sm font-bold text-gray-500 uppercase tracking-wide mb-1">총 인원</p>
                                    <p className="text-3xl font-extrabold text-gray-900">{participants.length}<span className="text-lg font-medium text-gray-400 ml-1">명</span></p>
                                </div>
                                <div className="modern-card p-5 text-center">
                                    <p className="text-sm font-bold text-gray-500 uppercase tracking-wide mb-1">장소</p>
                                    <p className="text-3xl font-extrabold text-gray-900">{locations.length}<span className="text-lg font-medium text-gray-400 ml-1">곳</span></p>
                                </div>
                                <div className="modern-card p-5 text-center">
                                    <p className="text-sm font-bold text-gray-500 uppercase tracking-wide mb-1">간격</p>
                                    <p className="text-3xl font-extrabold text-gray-900">{config.interval}<span className="text-lg font-medium text-gray-400 ml-1">분</span></p>
                                </div>
                                <div className="modern-card p-5 text-center bg-indigo-50 border-indigo-100">
                                    <p className="text-sm font-bold text-indigo-400 uppercase tracking-wide mb-1">방식</p>
                                    <p className="text-lg font-bold text-indigo-700">{config.mergeRemainder ? "균등 배정" : "정량 배정"}</p>
                                    <p className="text-sm text-indigo-500 font-medium">{config.genderRule === 'mixed' ? '혼성' : '분리'}</p>
                                </div>
                            </div>

                            {/* Time Bar */}
                            <div className="modern-card bg-gray-900 text-white p-5 flex flex-col sm:flex-row justify-between items-center shadow-xl shadow-gray-300">
                                <div className="flex items-center gap-3 mb-2 sm:mb-0">
                                    <div className="bg-white/10 p-2 rounded-lg"><Clock className="w-5 h-5 text-indigo-300" /></div>
                                    <span className="font-bold text-lg">전시대 봉사 시간</span>
                                </div>
                                <div className="flex flex-col sm:flex-row items-center gap-4 text-center sm:text-right">
                                    <div className="text-2xl font-mono font-bold tracking-widest text-indigo-200">{config.startTime} ~ {config.endTime}</div>
                                    {manager.name && (
                                        <div className="flex items-center gap-2 bg-white/10 px-3 py-1.5 rounded-lg border border-white/10">
                                            <span className="text-xs text-indigo-300 font-semibold uppercase tracking-wider">인도자</span>
                                            <span className="text-base font-bold">{manager.name}</span>
                                        </div>
                                    )}
                                </div>
                            </div>

                            {/* Schedule Table */}
                            <div className="modern-card overflow-hidden">
                                <div className="overflow-x-auto pb-4">
                                    <table className="w-full text-left border-collapse min-w-full">
                                        <thead>
                                            <tr className="bg-gray-50 border-b-2 border-gray-200">
                                                <th className="sticky-col-header p-5 font-bold text-gray-600 text-sm uppercase tracking-wider w-28 border-r-2 border-gray-200 shadow-sm z-30">Time</th>
                                                {locations.map((loc, idx) => (
                                                    <th key={idx} className={`p-5 font-bold text-gray-600 text-sm uppercase tracking-wider min-w-[200px] border-r-2 border-gray-200 ${idx === locations.length - 1 ? 'border-r-0' : ''}`}>
                                                        <div className="flex items-center justify-center gap-2">
                                                            <MapPin className="w-4 h-4 text-indigo-600" /> {loc}
                                                        </div>
                                                    </th>
                                                ))}
                                            </tr>
                                        </thead>
                                        <tbody className="divide-y divide-gray-100">
                                            {Object.keys(schedule).sort().map((time) => (
                                                <tr key={time} className="hover:bg-gray-50 transition-colors">
                                                    <td className="sticky-col-cell p-5 font-mono font-bold text-gray-700 text-lg border-r-2 border-gray-200 shadow-[4px_0_10px_-4px_rgba(0,0,0,0.05)]">{time}</td>
                                                    {locations.map((loc, idx) => (
                                                        <td key={`${time}-${loc}`} className={`p-4 align-top border-r-2 border-gray-200 text-center ${idx === locations.length - 1 ? 'border-r-0' : ''}`}>
                                                            <div className="flex flex-wrap gap-1.5 justify-center">
                                                                {schedule[time]?.[loc]?.map((person, pIdx) => (
                                                                    person ? (
                                                                        <div key={pIdx} className={`flex items-center gap-1 px-2 py-1.5 rounded-lg text-base font-bold shadow-sm border whitespace-nowrap ${person.gender === 'M' ? 'bg-blue-50 text-blue-700 border-blue-200' : 'bg-pink-50 text-pink-700 border-pink-200'}`}>
                                                                            <div className={`w-2 h-2 rounded-full shrink-0 ${person.gender === 'M' ? 'bg-blue-500' : 'bg-pink-500'}`}></div>
                                                                            {person.name}
                                                                        </div>
                                                                    ) : (
                                                                        <div key={pIdx} className="flex items-center gap-1 px-2 py-1.5 rounded-lg text-sm font-medium text-gray-400 bg-gray-50 border border-dashed border-gray-300 whitespace-nowrap">
                                                                            <AlertCircle className="w-4 h-4"/> 비움
                                                                        </div>
                                                                    )
                                                                ))}
                                                                {(!schedule[time]?.[loc] || schedule[time][loc].length === 0) && <span className="text-gray-300 text-sm px-2">-</span>}
                                                            </div>
                                                        </td>
                                                    ))}
                                                </tr>
                                            ))}
                                            {Object.keys(schedule).length === 0 && (
                                                <tr><td colSpan={locations.length + 1} className="p-20 text-center text-gray-500 font-medium text-lg">상단 '설정' 버튼을 눌러 근무표를 생성해주세요.</td></tr>
                                            )}
                                        </tbody>
                                    </table>
                                </div>
                            </div>
                        </div>

                    </main>

                    {/* Footer */}
                    <footer className="py-8 text-center text-gray-400 text-sm border-t border-gray-200 mt-auto bg-gray-50">
                        <p className="flex items-center justify-center gap-2 mb-2"><span className="w-2 h-2 rounded-full bg-green-400"></span> 모든 데이터는 저장되지 않습니다.</p>
                        <p>문의하기: <a href="mailto:mifarssel25@gmail.com" className="hover:text-indigo-600 transition font-medium underline decoration-indigo-200 underline-offset-4">mifarssel25@gmail.com</a></p>
                    </footer>

                    {/* Alert Modal */}
                    {alertData.isOpen && (
                        <div className="fixed inset-0 bg-black/50 backdrop-blur-sm z-[60] flex items-center justify-center p-6 animate-[fadeIn_0.2s_ease-out]">
                            <div className="bg-white w-full max-w-md rounded-2xl shadow-2xl overflow-hidden border border-red-100 animate-[scaleUp_0.3s_cubic-bezier(0.16,1,0.3,1)]">
                                <div className="p-6 bg-red-50 border-b border-red-100 flex items-start gap-4">
                                    <div className="bg-red-100 p-2 rounded-full text-red-600"><AlertTriangle className="w-6 h-6" /></div>
                                    <div>
                                        <h3 className="text-lg font-bold text-red-900">누락 인원 발생!</h3>
                                        <p className="text-sm text-red-700 mt-1">다음 인원이 스케줄에 한 번도 배정되지 않았습니다.</p>
                                    </div>
                                </div>
                                <div className="p-6">
                                    <div className="bg-gray-50 rounded-lg p-3 mb-4 border border-gray-200">
                                        <p className="font-bold text-gray-800">{alertData.missing.join(", ")}</p>
                                    </div>
                                    <div className="text-sm text-gray-600 whitespace-pre-line bg-blue-50 p-4 rounded-xl border border-blue-100 text-blue-900 leading-relaxed">
                                        {alertData.suggestion}
                                    </div>
                                </div>
                                <div className="p-4 border-t border-gray-100 bg-gray-50 flex justify-end">
                                    <button onClick={() => setAlertData({ ...alertData, isOpen: false })} className="px-6 py-2.5 bg-gray-900 text-white font-bold rounded-xl hover:bg-black transition">확인</button>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* Setup Modal */}
                    {isSetupOpen && (
                        <div className="fixed inset-0 bg-gray-900/40 backdrop-blur-sm z-50 flex items-center justify-center p-4 transition-opacity">
                            <div className="bg-white w-full max-w-4xl rounded-3xl shadow-2xl flex flex-col max-h-[90vh] overflow-hidden border border-gray-200">
                                <div className="px-8 py-5 border-b border-gray-100 flex justify-between items-center bg-white">
                                    <h2 className="text-2xl font-extrabold text-gray-900">환경 설정</h2>
                                    <button onClick={() => setIsSetupOpen(false)} className="w-10 h-10 flex items-center justify-center rounded-full bg-gray-100 text-gray-500 hover:bg-gray-200 transition">
                                        <X className="w-6 h-6" />
                                    </button>
                                </div>

                                <div className="flex border-b border-gray-200 bg-gray-50">
                                    <button onClick={() => setActiveTab('basic')} className={`flex-1 py-4 text-base font-bold transition ${activeTab === 'basic' ? 'bg-white text-indigo-600 border-t-2 border-indigo-600' : 'text-gray-500 hover:bg-gray-100'}`}>1. 기본 규칙 & 장소</button>
                                    <button onClick={() => setActiveTab('participants')} className={`flex-1 py-4 text-base font-bold transition ${activeTab === 'participants' ? 'bg-white text-indigo-600 border-t-2 border-indigo-600' : 'text-gray-500 hover:bg-gray-100'}`}>2. 참여자 관리</button>
                                </div>

                                <div className="flex-1 overflow-y-auto p-6 bg-white">
                                    {activeTab === 'basic' && (
                                        <div className="space-y-8 max-w-3xl mx-auto">
                                            {/* 섹션 1 */}
                                            <div className="bg-gray-50 rounded-2xl p-6 border border-gray-100">
                                                <h3 className="text-lg font-bold text-gray-900 mb-4 flex items-center gap-2"><Phone className="w-5 h-5 text-gray-400"/> 인도자 정보</h3>
                                                <div className="grid md:grid-cols-2 gap-5">
                                                    <div>
                                                        <label className="block text-sm font-bold text-gray-700 mb-1.5">이름</label>
                                                        <input type="text" value={manager.name} onChange={(e) => setManager({...manager, name: e.target.value})} placeholder=인도자 성함" className="modern-input" />
                                                    </div>
                                                    <div>
                                                        <label className="block text-sm font-bold text-gray-700 mb-1.5">연락처</label>
                                                        <input type="tel" value={manager.phone} onChange={(e) => setManager({...manager, phone: e.target.value})} placeholder="010-0000-0000" className="modern-input" />
                                                    </div>
                                                </div>
                                            </div>

                                            {/* 섹션 2 */}
                                            <div className="bg-gray-50 rounded-2xl p-6 border border-gray-100">
                                                <h3 className="text-lg font-bold text-gray-900 mb-4 flex items-center gap-2"><Clock className="w-5 h-5 text-gray-400"/> 시간 및 인원</h3>
                                                <div className="grid grid-cols-2 md:grid-cols-4 gap-5">
                                                    {/* [Updated] TimeSelect 컴포넌트 사용 */}
                                                    <div><label className="block text-sm font-bold text-gray-700 mb-1.5">시작</label><TimeSelect value={config.startTime} onChange={(e) => setConfig({...config, startTime: e.target.value})} className="modern-input cursor-pointer" /></div>
                                                    <div><label className="block text-sm font-bold text-gray-700 mb-1.5">종료</label><TimeSelect value={config.endTime} onChange={(e) => setConfig({...config, endTime: e.target.value})} className="modern-input cursor-pointer" /></div>
                                                    <div><label className="block text-sm font-bold text-gray-700 mb-1.5">간격</label>
                                                        <select name="interval" value={config.interval} onChange={handleConfigChange} className="modern-input">
                                                            {[5,10,15,20,25,30,60].map(m => <option key={m} value={m}>{m}분</option>)}
                                                        </select>
                                                    </div>
                                                    <div><label className="block text-sm font-bold text-gray-700 mb-1.5">인원/조</label><input type="number" name="peoplePerShift" min="1" max="10" value={config.peoplePerShift} onChange={handleConfigChange} className="modern-input" /></div>
                                                </div>
                                                
                                                <div className="mt-6 flex flex-col md:flex-row gap-4">
                                                    <div className="flex-1 bg-white p-4 rounded-xl border border-gray-200 shadow-sm">
                                                        <p className="text-base font-bold text-gray-900 mb-2">자투리 인원 처리</p>
                                                        <div className="flex bg-gray-100 p-1 rounded-lg">
                                                            <label className={`flex-1 text-center py-2 text-sm font-bold rounded-md cursor-pointer transition ${config.mergeRemainder ? 'bg-white shadow-sm text-indigo-600 ring-1 ring-black/5' : 'text-gray-500'}`}>
                                                                <input type="radio" name="mergeRemainder" checked={config.mergeRemainder} onChange={() => setConfig({...config, mergeRemainder: true})} className="hidden" /> 균등 배정
                                                            </label>
                                                            <label className={`flex-1 text-center py-2 text-sm font-bold rounded-md cursor-pointer transition ${!config.mergeRemainder ? 'bg-white shadow-sm text-indigo-600 ring-1 ring-black/5' : 'text-gray-500'}`}>
                                                                <input type="radio" name="mergeRemainder" checked={!config.mergeRemainder} onChange={() => setConfig({...config, mergeRemainder: false})} className="hidden" /> 정량 배정
                                                            </label>
                                                        </div>
                                                        <p className="text-xs text-gray-500 mt-2 text-center">균등: 남은 인원을 골고루 나눔 / 정량: 1명이라도 별도 팀 생성</p>
                                                    </div>

                                                    <div className="flex-1 bg-white p-4 rounded-xl border border-gray-200 shadow-sm">
                                                        <p className="text-base font-bold text-gray-900 mb-2">성별 배치</p>
                                                        <div className="flex bg-gray-100 p-1 rounded-lg">
                                                            <label className={`flex-1 text-center py-2 text-sm font-bold rounded-md cursor-pointer transition ${config.genderRule === 'mixed' ? 'bg-white shadow-sm text-indigo-600 ring-1 ring-black/5' : 'text-gray-500'}`}>
                                                                <input type="radio" name="genderRule" value="mixed" checked={config.genderRule === 'mixed'} onChange={handleConfigChange} className="hidden" /> 혼성
                                                            </label>
                                                            <label className={`flex-1 text-center py-2 text-sm font-bold rounded-md cursor-pointer transition ${config.genderRule === 'separate' ? 'bg-white shadow-sm text-indigo-600 ring-1 ring-black/5' : 'text-gray-500'}`}>
                                                                <input type="radio" name="genderRule" value="separate" checked={config.genderRule === 'separate'} onChange={handleConfigChange} className="hidden" /> 분리
                                                            </label>
                                                        </div>
                                                    </div>
                                                </div>
                                            </div>

                                            {/* 섹션 3 */}
                                            <div className="bg-gray-50 rounded-2xl p-6 border border-gray-100">
                                                <div className="flex justify-between items-center mb-4">
                                                    <h3 className="text-lg font-bold text-gray-900 flex items-center gap-2"><MapPin className="w-5 h-5 text-gray-400"/> 장소 ({config.locationCount})</h3>
                                                    <div className="flex gap-2">
                                                        <button onClick={() => updateLocations(config.locationCount - 1)} className="w-9 h-9 bg-white border border-gray-200 rounded-lg flex items-center justify-center hover:bg-gray-50 text-gray-600 font-bold shadow-sm">-</button>
                                                        <button onClick={() => updateLocations(config.locationCount + 1)} className="w-9 h-9 bg-white border border-gray-200 rounded-lg flex items-center justify-center hover:bg-gray-50 text-gray-600 font-bold shadow-sm">+</button>
                                                    </div>
                                                </div>
                                                <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                                                    {locations.map((loc, idx) => (
                                                        <div key={idx} className="flex items-center gap-3">
                                                            <div className="w-8 h-8 rounded-lg bg-indigo-600 text-white flex items-center justify-center text-sm font-bold shadow-sm">{idx+1}</div>
                                                            <input type="text" value={loc} onChange={(e) => handleLocationNameChange(idx, e.target.value)} className="modern-input" placeholder="장소명 입력" />
                                                        </div>
                                                    ))}
                                                </div>
                                            </div>
                                        </div>
                                    )}

                                    {activeTab === 'participants' && (
                                        <div className="flex flex-col h-full max-w-4xl mx-auto">
                                            {/* [Updated] 버튼에 인원수 표시 */}
                                            <div className="flex gap-3 mb-6">
                                                <button onClick={() => setGenderTab('M')} className={`flex-1 py-4 rounded-xl text-lg font-bold transition flex items-center justify-center gap-2 border-2 ${genderTab === 'M' ? 'bg-blue-600 text-white border-blue-600 shadow-md' : 'bg-white text-gray-400 border-gray-200 hover:border-gray-300'}`}>남성 목록 ({maleCount}명)</button>
                                                <button onClick={() => setGenderTab('F')} className={`flex-1 py-4 rounded-xl text-lg font-bold transition flex items-center justify-center gap-2 border-2 ${genderTab === 'F' ? 'bg-pink-600 text-white border-pink-600 shadow-md' : 'bg-white text-gray-400 border-gray-200 hover:border-gray-300'}`}>여성 목록 ({femaleCount}명)</button>
                                            </div>
                                            
                                            <div className="flex gap-2 relative mb-6">
                                                <div className="relative flex-1">
                                                    <input type="text" value={newNameInput} onChange={(e) => setNewNameInput(e.target.value)} onKeyDown={handleAddParticipant} placeholder="새로운 참여자 이름 입력" className="modern-input pl-5 pr-24 py-4 text-lg shadow-sm border-gray-300" />
                                                    <button onClick={() => handleAddParticipant({ key: 'Enter', preventDefault: () => {} })} className="absolute right-2 top-2 bottom-2 px-6 bg-gray-900 text-white rounded-lg text-base font-bold hover:bg-black transition">추가</button>
                                                </div>
                                                {/* 전체 삭제 버튼 제거됨 */}
                                            </div>

                                            {/* Improved List View for Scalability */}
                                            <div className="flex-1 overflow-y-auto bg-gray-50 rounded-2xl border border-gray-200 p-2">
                                                {filteredParticipants.length === 0 ? (
                                                    <div className="flex flex-col items-center justify-center h-48 text-gray-400">
                                                        <Users className="w-12 h-12 mb-2 opacity-20"/>
                                                        <p className="text-lg font-medium">등록된 인원이 없습니다.</p>
                                                    </div>
                                                ) : (
                                                    <div className="space-y-2">
                                                        {filteredParticipants.map((p) => (
                                                            <div key={p.id} className="bg-white p-4 rounded-xl border border-gray-200 shadow-sm flex flex-col md:flex-row items-center gap-4 transition hover:border-indigo-300">
                                                                <div className="flex items-center gap-4 w-full md:w-auto min-w-[200px]">
                                                                    <div className={`w-12 h-12 rounded-full flex items-center justify-center text-xl font-bold text-white shadow-sm shrink-0 ${p.gender === 'M' ? 'bg-blue-500' : 'bg-pink-500'}`}>{p.name[0]}</div>
                                                                    <div className="flex flex-col">
                                                                        <input type="text" value={p.name} onChange={(e) => updateParticipant(p.id, 'name', e.target.value)} className="font-bold text-xl text-gray-900 bg-transparent outline-none w-32 border-b border-transparent hover:border-gray-300 focus:border-indigo-500 transition-colors" />
                                                                    </div>
                                                                </div>
                                                                
                                                                <div className="flex flex-wrap items-center gap-3 flex-1 w-full">
                                                                    <div className="flex items-center gap-2 bg-gray-100 rounded-lg px-3 py-2 flex-1 min-w-[140px]">
                                                                        <LinkIcon className="w-4 h-4 text-gray-500" />
                                                                        <select value={p.partnerId || ""} onChange={(e) => updateParticipant(p.id, 'partnerId', e.target.value)} className="modern-input !py-2 !text-sm bg-transparent !border-0 focus:!ring-0 cursor-pointer">
                                                                            <option value="">계획된 짝 없음</option>
                                                                            {participants.filter(u => u.id !== p.id).map(u => <option key={u.id} value={u.id}>{u.name}</option>)}
                                                                        </select>
                                                                    </div>
                                                                    <div className="flex items-center gap-2 bg-gray-100 rounded-lg px-3 py-2 flex-1 min-w-[140px]">
                                                                        <Lock className="w-4 h-4 text-gray-500" />
                                                                        <select value={p.preferredLocation || ""} onChange={(e) => updateParticipant(p.id, 'preferredLocation', e.target.value)} className="modern-input !py-2 !text-sm bg-transparent !border-0 focus:!ring-0 cursor-pointer">
                                                                            <option value="">장소 미지정</option>
                                                                            {locations.map((loc, idx) => <option key={idx} value={idx}>{loc}</option>)}
                                                                        </select>
                                                                    </div>
                                                                </div>

                                                                <div className="flex items-center gap-4 w-full md:w-auto justify-between border-t md:border-t-0 pt-3 md:pt-0 border-gray-100">
                                                                    <div className="flex items-center gap-2">
                                                                        <ToggleSwitch id={`time-toggle-${p.id}`} checked={!p.useDefaultTime} onChange={() => toggleTimeSettings(p.id)} />
                                                                        <span className="text-sm font-bold text-gray-600">시간 지정</span>
                                                                    </div>
                                                                    {!p.useDefaultTime && (
                                                                        <div className="flex items-center gap-1 bg-white border border-gray-300 rounded-lg px-2 py-1 shadow-sm">
                                                                            {/* [Updated] 개별 시간 설정도 TimeSelect 사용 (범위 제한) */}
                                                                            <TimeSelect 
                                                                                value={p.availStart} 
                                                                                onChange={(e) => updateParticipant(p.id, 'availStart', e.target.value)} 
                                                                                options={restrictedTimeOptions}
                                                                                className="text-sm font-mono font-bold bg-transparent outline-none w-20 text-center cursor-pointer" 
                                                                            />
                                                                            <span className="text-gray-400">~</span>
                                                                            <TimeSelect 
                                                                                value={p.availEnd} 
                                                                                onChange={(e) => updateParticipant(p.id, 'availEnd', e.target.value)} 
                                                                                options={restrictedTimeOptions}
                                                                                className="text-sm font-mono font-bold bg-transparent outline-none w-20 text-center cursor-pointer" 
                                                                            />
                                                                        </div>
                                                                    )}
                                                                    <button onClick={() => removeParticipant(p.id)} className="w-10 h-10 flex items-center justify-center bg-gray-100 text-gray-400 rounded-full hover:bg-red-50 hover:text-red-500 transition ml-2"><Trash2 className="w-5 h-5" /></button>
                                                                </div>
                                                            </div>
                                                        ))}
                                                    </div>
                                                )}
                                            </div>
                                            <div className="mt-4 text-center text-xs text-gray-400">
                                                <p>⚠️ 입력하신 정보는 브라우저에만 저장되며 서버로 전송되지 않습니다.</p>
                                            </div>
                                        </div>
                                    )}
                                </div>
                                
                                <div className="p-5 bg-white border-t border-gray-200 flex justify-end gap-4 shrink-0 shadow-[0_-4px_6px_-1px_rgba(0,0,0,0.05)]">
                                    <button onClick={() => setIsSetupOpen(false)} className="px-8 py-3.5 text-gray-600 font-bold hover:bg-gray-100 rounded-xl transition text-lg">취소</button>
                                    <button onClick={() => { generateSchedule(); setIsSetupOpen(false); }} className="px-10 py-3.5 bg-indigo-600 text-white font-bold rounded-xl shadow-lg hover:bg-indigo-700 transition flex items-center gap-2 text-lg">
                                        <Save className="w-6 h-6" /> 저장 및 생성
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<ShiftScheduler />);
    </script>
</body>
</html>
